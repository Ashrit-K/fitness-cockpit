name: Update Weight Chart

on:
  schedule:
    # 15:00 IST and 19:00 IST — after a late-morning or an afternoon session.
    # GitHub runs cron in UTC and can start a scheduled job several minutes late.
    - cron: "30 9 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install matplotlib numpy

      - name: Fetch data
        env:
          LIFTOSAUR_TOKEN: ${{ secrets.LIFTOSAUR_TOKEN }}
        run: python fetch.py

      - name: Build muscle map
        run: python muscle_map.py

      - name: Generate charts
        run: |
          python chart.py
          python volume.py

      - name: Build report
        run: python report.py

      - name: Run tests
        run: python -m pip install pytest && python -m pytest tests/ -q

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart.png stats.json weights.json volume_stats.json report.json chart_sets.png chart_tonnage.png chart_targets.png history.json custom_exercises.json muscle_map.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update weight chart $(date -u +%Y-%m-%d)"
            git push
          fi
